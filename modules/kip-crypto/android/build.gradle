plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fersonull.kip'
version = '1.0.0'

android {
  namespace "expo.modules.kipcrypto"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "org.bouncycastle:bcprov-jdk18on:1.80"
}
